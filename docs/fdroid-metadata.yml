# Vorlage für den F-Droid-Eintrag.
#
# Diese Datei gehört NICHT in dieses Repo, sondern als
# `metadata/com.finanzgame.finanzgame.yml` in einen Fork von
# https://gitlab.com/fdroid/fdroiddata — von dort kommt der Merge Request.
# Sie liegt hier, damit die Werte versioniert sind und nicht bei jedem
# Update neu zusammengesucht werden müssen.
#
# Aufgebaut nach `templates/build-flutter.yml` in fdroiddata, srclib-Variante.
# Auf Bitte von @linsui im MR !49022 (16.09.2026): Die Flutter-Version steht
# nicht mehr im Rezept, sondern in `.flutter-version` im App-Repo und wird im
# prebuild ausgelesen. Damit zieht ein Toolchain-Wechsel keine Änderung am
# Rezept nach sich.

Categories:
  - Finance Manager
  - Educational Game
License: GPL-3.0-or-later
AuthorName: neuerfokus
SourceCode: https://github.com/neuerfokus/finanzgame
IssueTracker: https://github.com/neuerfokus/finanzgame/issues
Changelog: https://github.com/neuerfokus/finanzgame/releases
Donate: https://ko-fi.com/finanzgame

AutoName: Finanzgame

RepoType: git
Repo: https://github.com/neuerfokus/finanzgame.git

Builds:
  - versionName: 1.10.0
    versionCode: 191
    commit: 7daf07f1c58aff9e71ff0bcc9db3dc9fc3cac3db
    sudo:
      - apt-get update
      - apt-get install -y curl unzip xz-utils
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      # Version aus dem App-Repo lesen und im srclib auschecken
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      # Pub-Cache ins Projekt legen, damit der Scanner die Dart-Pakete sieht
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
      - build
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version v%v+%c
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.10.0
CurrentVersionCode: 191

# Hinweise zum MR
#
# 1. `commit:` nimmt den vollen Hash, keinen Tag und keinen Branch — Bitte von
#    @linsui im MR !49022. Ein Tag lässt sich nachträglich verschieben, ein
#    Hash nicht; F-Droid baut damit nachweislich denselben Stand. Der Tag
#    `v1.10.0+190` zeigt auf denselben Commit und bleibt für `AutoUpdateMode`
#    zuständig.
#
# 1b. `.flutter-version` muss in genau diesem Commit liegen. v1.10.0+189
#    enthält die Datei noch nicht; dort bräche der prebuild mit leerer
#    Variable ab — was `[[ $flutterVersion ]]` bewusst erzwingt.
#
# 2. Kein `subdir`: `pubspec.yaml` liegt im Wurzelverzeichnis.
#
# 3. Kein `rm:`-Block: Das Repo enthält nur `android/`, keine ios-, linux-,
#    macos-, web- oder windows-Verzeichnisse.
#
# 4. Universelle APK statt `--split-per-abi`. Kann auf Wunsch umgestellt
#    werden; dann braucht es drei Build-Blöcke plus `VercodeOperation`.
#
# 5. `key.properties` existiert im öffentlichen Repo nicht, deshalb greift in
#    `android/app/build.gradle.kts` der Debug-Keystore-Fallback und die Datei
#    heißt `app-release.apk` ohne `-unsigned`. F-Droid entfernt die Signatur
#    und signiert selbst — eine F-Droid-Installation lässt sich deshalb nicht
#    über eine bestehende Sideload-Installation legen. Wer wechselt,
#    exportiert vorher den Spielstand.
#
# 6. Anti-Features: keine. Weder Werbung noch Tracking noch proprietäre
#    Abhängigkeiten. Der Trinkgeld-Link öffnet den externen Browser.
#
# 6b. `License:` nimmt nur EINEN Wert — Hinweis von @linsui im MR !49022.
#    Eine SPDX-Verknuepfung mit AND ist dort nicht vorgesehen. Eingetragen
#    ist deshalb die Lizenz des Quelltextes. Die Lizenzen der Assets
#    (CC-BY-SA-4.0 fuer eigene Inhalte, CC-BY-4.0 fuer Twemoji, CC0-1.0 fuer
#    Kenney) stehen pro Datei in ASSETS.md und in der App unter
#    Einstellungen -> Ueber & Lizenzen.
#
# 7. Beschreibungen und Änderungsprotokolle werden NICHT hier gepflegt —
#    F-Droid liest sie aus `fastlane/metadata/android/` im App-Repo.
